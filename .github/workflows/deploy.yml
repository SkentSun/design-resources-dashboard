name: Refresh & Deploy Dashboard

# 触发方式：
#   1) 每 6 小时自动跑（UTC 0/6/12/18 点 ≈ 北京时间 08/14/20/02 点），抓取最新内容并部署
#   2) 在 GitHub 仓库 Actions 页手动点 "Run workflow" 立即触发（替代本地"采集"按钮）
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'refresh_lib.py'
      - 'design-resources-dashboard.html'
      - 'logo.png'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Refresh data (safe fallback to committed file on failure)
        run: |
          python refresh_lib.py && echo "REFRESH_OK" || echo "REFRESH_FAILED"
          # 校验产物：能解析且条数 >= 600 才部署；否则回退到已提交的完整文件，
          # 防止刷新抓取全部失败 / 写一半被打断时把坏版本部署上线。
          python - <<'PY'
          import re, json, subprocess
          s = open('design-resources-dashboard.html', encoding='utf-8').read()
          try:
              i = s.index('const ITEMS'); k = s.index('[', i); d = 0; j = k
              ins = False; e = False
              while j < len(s):
                  c = s[j]
                  if e: e = False; j += 1; continue
                  if c == '\\': e = True; j += 1; continue
                  if c == '"': ins = not ins; j += 1; continue
                  if not ins:
                      if c == '[': d += 1
                      elif c == ']':
                          d -= 1
                          if d == 0: j += 1; break
                  j += 1
              n = len(json.loads(s[k:j]))
          except Exception:
              n = -1
          if n < 600:
              print(f"产物无效（{n} 条），回退到已提交的完整文件")
              subprocess.run(['git', 'checkout', '--', 'design-resources-dashboard.html'], check=True)
          else:
              print(f"产物有效，共 {n} 条")

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Provide index.html at site root
        # 双向同步，确保根路径(index.html)与文件名路径(design-resources-dashboard.html)内容一致，
        # 避免访问带文件名的 URL 时命中旧版本。
        run: cp design-resources-dashboard.html index.html && cp index.html design-resources-dashboard.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
