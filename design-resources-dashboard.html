<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Scan · 精选设计作品</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f5f5f7; --panel:#fbfbfd; --card:#ffffff;
    --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --line-soft:#e8e8ed;
    --accent:#0071e3; --accent-soft:#e8f1fd;
    --nav-bg:var(--panel); --nav-border:var(--line-soft);
    --shadow:0 2px 14px rgba(0,0,0,.06); --shadow-hover:0 16px 44px rgba(0,0,0,.14);
    --pill:#f5f5f7; --pill-active:#1d1d1f; --pill-active-text:#fff;
    --sidebar-w:236px;
  }
  [data-theme="dark"]{
    --bg:#000000; --bg2:#0a0a0a; --panel:#161618; --card:#1d1d1f;
    --text:#f5f5f7; --muted:#a1a1a6; --line:#38383a; --line-soft:#2a2a2c;
    --accent:#2997ff; --accent-soft:#0a2540;
    --nav-bg:#161618; --nav-border:#2a2a2c;
    --shadow:0 2px 14px rgba(0,0,0,.5); --shadow-hover:0 16px 44px rgba(0,0,0,.7);
    --pill:#2a2a2c; --pill-active:#f5f5f7; --pill-active-text:#1d1d1f;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased;
    transition:background .4s ease, color .4s ease; min-height:100vh;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- sidebar ---------- */
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--bg);
    border-right:1px solid var(--line-soft);display:flex;flex-direction:column;overflow-y:auto;
    padding:24px 18px 32px 22px;transition:background .4s,border-color .4s}
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:-.02em;margin-bottom:30px}
  .brand .logo{width:24px;height:24px;border-radius:7px;object-fit:cover;flex:none}
  .sect{margin-bottom:26px}
  .sect-title{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:0 0 9px;padding-left:2px;opacity:.8}
  .nav-item{position:relative;display:flex;align-items:center;gap:8px;padding:5px 2px;border-radius:0;cursor:pointer;
    color:var(--muted);font-size:12.5px;transition:color .15s;margin-bottom:1px}
  .nav-item:hover{color:var(--text);background:transparent}
  .nav-item.active{color:var(--text);font-weight:500}
  .nav-item.active::before{content:"";position:absolute;left:-22px;top:50%;transform:translateY(-50%);width:3px;height:14px;border-radius:0 2px 2px 0;background:var(--text)}
  .nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-size:11px;color:var(--muted);background:transparent;padding:0;font-weight:400;opacity:.7}
  .nav-item.active .count{color:var(--text);opacity:1;font-weight:500}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:transparent;color:var(--muted);
    cursor:pointer;border:1px solid var(--line-soft);transition:.16s;display:inline-flex;align-items:center;gap:5px}
  .pill:hover{color:var(--text);border-color:var(--line);background:transparent}
  .pill.active{color:var(--text);border-color:var(--text);background:transparent;font-weight:500}
  .pill .pc{font-size:10px;opacity:.55;font-weight:400}

  /* ---------- main ---------- */
  .main{margin-left:var(--sidebar-w);padding:26px 30px 70px;min-width:0;transition:margin .2s}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .topbar h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
  .topbar .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line-soft);
    border-radius:980px;padding:8px 15px;min-width:200px}
  .search input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%}
  .search input::placeholder{color:var(--muted)}
  .search svg{flex:none;opacity:.5}
  .sort-sel{background:var(--bg2);border:1px solid var(--line-soft);border-radius:980px;padding:8px 16px;
    color:var(--text);font-size:13px;outline:none;cursor:pointer}
  .theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-soft);background:var(--bg2);
    color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .refresh-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;
    border-radius:980px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .refresh-btn:hover{opacity:.9}
  .refresh-btn:disabled{opacity:.55;cursor:progress}
  .refresh-btn svg{width:15px;height:15px}
  .refresh-btn.spin svg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:11px 20px;border-radius:14px;font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.3s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .theme-btn:hover{transform:scale(1.06)}
  .theme-btn:active{transform:scale(.94)}

  /* ---------- masonry waterfall ---------- */
  .masonry{column-count:3;column-gap:22px}
  @media (max-width:1280px){.masonry{column-count:2}}
  @media (max-width:680px){.masonry{column-count:1}}
  .card{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;margin:0 0 22px;
    box-shadow:var(--shadow);border:1px solid var(--line-soft);transition:transform .26s cubic-bezier(.2,.7,.2,1),box-shadow .26s;
    break-inside:avoid;display:flex;flex-direction:column;animation:rise .5s both}
  .card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .thumb{position:relative;width:100%;background:var(--bg2);overflow:hidden}
  .thumb.video{aspect-ratio:4/3}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .thumb.text{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent-soft),var(--bg2))}
  .thumb.text span{font-size:13px;font-weight:600;color:var(--accent);padding:0 18px;text-align:center}
  .card:hover .thumb img,.card:hover .thumb video{transform:scale(1.05)}
  .live{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600;
    padding:3px 8px;border-radius:980px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:5px}
  .live .dot{width:6px;height:6px;border-radius:50%;background:#ff375f;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .info{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
  .info .site{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin:0 0 5px}
  .info h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;line-height:1.32}
  .info .author{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .cat{font-size:11px;padding:3px 9px;border-radius:980px;background:var(--accent-soft);color:var(--accent);font-weight:500}
  .cta{margin-top:13px;font-size:13px;font-weight:500;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
  .card:hover .cta{gap:8px;transition:gap .2s}
  .empty{color:var(--muted);padding:80px 0;text-align:center;font-size:15px}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.22s}
  .modal.show{opacity:1;pointer-events:auto}
  .modal-card{background:var(--card);border-radius:24px;width:min(880px,100%);max-height:90vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.5);
    transform:translateY(12px) scale(.985);transition:.22s;position:relative}
  .modal.show .modal-card{transform:none}
  .modal-media{background:var(--bg2);max-height:44vh;overflow:hidden;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line-soft)}
  .modal-media video,.modal-media img{max-width:100%;max-height:44vh;object-fit:contain;display:block}
  .modal-body{overflow-y:auto;padding:24px 28px 28px}
  .modal-close{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;
    background:rgba(120,120,120,.35);color:#fff;border:none;font-size:16px;cursor:pointer;z-index:3;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
  .modal-close:hover{background:rgba(120,120,120,.6)}
  .modal h2{margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:-.02em;padding-right:44px}
  .m-author{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .m-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .m-chip{font-size:11.5px;padding:5px 11px;border-radius:980px;background:var(--pill);color:var(--text);font-weight:500}
  .m-chip.cat{background:var(--accent-soft);color:var(--accent)}
  .m-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 18px;font-size:13.5px}
  .m-meta dt{color:var(--muted)}
  .m-meta dd{margin:0;word-break:break-word}
  .m-text{font-size:14.5px;line-height:1.75;white-space:pre-wrap;background:var(--bg2);
    border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;margin:0 0 18px;color:var(--text)}
  .m-md{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;
    background:var(--bg2);border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;max-height:320px;overflow:auto}
  .m-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
  .m-foot{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
  .m-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;
    padding:11px 22px;border-radius:980px;text-decoration:none;transition:.2s}
  .m-btn:hover{filter:brightness(1.08)}
  .detail-hint{font-size:12px;color:var(--muted);margin-top:16px}

  /* ---------- favorites & window ---------- */
  .fav-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:none;
    background:rgba(0,0,0,.42);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:15px;z-index:3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:.2s}
  .fav-btn:hover{transform:scale(1.12)}
  .fav-btn.on{background:var(--accent);color:#fff}
  @media (max-width:860px){.sidebar{display:none}.main{margin-left:0;padding:20px}}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="logo" src="logo.png" alt="Design Scan logo"> Design Scan</div>

    <div class="sect">
      <p class="sect-title">Collections</p>
      <div id="site-nav"></div>
    </div>

    <div class="sect">
      <p class="sect-title">Categories</p>
      <div class="pills" id="cat-chips"></div>
    </div>

    <div class="sect">
      <p class="sect-title">Favorites</p>
      <div id="fav-nav"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="view-title">All showcases</h1>
        <div class="meta" id="view-meta"></div>
      </div>
      <div class="controls">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="search" placeholder="搜索作品、作者、标签…" />
        </label>
        <select id="sort" class="sort-sel" title="按时间排序">
          <option value="new">最新优先</option>
          <option value="old">最早优先</option>
        </select>
        <select id="win" class="sort-sel" title="时间窗口">
          <option value="auto" selected>自动</option>
          <option value="7">近一周</option>
          <option value="14">近两周</option>
        </select>
        <button class="refresh-btn" id="refreshBtn" title="手动采集最新内容">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span id="refreshLabel">手动采集</span>
        </button>
        <button class="theme-btn" id="themeBtn" title="切换明暗模式" aria-label="切换明暗模式"></button>
      </div>
    </div>

    <div class="masonry" id="grid"></div>
    <div class="empty hide" id="empty">没有匹配的作品，换个筛选条件试试。</div>
  </main>

  <div class="modal" id="modal"></div>

  const d=it.detail||{};
  let media='';
  if(it.video) media=`<video src="${esc(it.video)}" poster="${esc(it.image||'')}" autoplay loop muted playsinline></video>`;
  else if(it.image) media=`<img src="${esc(it.image)}" alt="${esc(it.title)}" onerror="this.style.display='none'">`;
  const chips=(it.source||[]).map(s=>`<span class="m-chip">${esc(s)}</span>`).join('');
  const catChips=(it.cats||[]).map(c=>`<span class="m-chip cat">${esc(c)}</span>`).join('');
  let tagHtml='';
  if(d.tags&&d.tags.length) tagHtml=`<div class="m-chips">${d.tags.map(t=>`<span class="m-chip">#${esc(t)}</span>`).join('')}</div>`;
  let metaHtml='';
  if(d.meta&&d.meta.length) metaHtml='<dl class="m-meta">'+d.meta.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')+'</dl>';
  let textHtml='';
  if(d.text) textHtml=`<div class="m-text">${esc(d.text)}</div>`;
  let mdHtml='';
  if(d.md) mdHtml=`<p class="m-section-label">DESIGN.md · 机器可读设计系统</p><div class="m-md">${esc(d.md)}</div>`;
  const orig=it.link||it.siteUrl;
  const inner=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    ${media?`<div class="modal-media">${media}</div>`:''}
    <div class="modal-body">
      <h2>${esc(it.title)}</h2>
      <div class="m-author">${esc(it.author)} · ${siteLabel(it.site)}</div>
      ${chips?`<div class="m-chips">${chips}</div>`:''}
      ${catChips?`<div class="m-chips">${catChips}</div>`:''}
      ${tagHtml}
      ${metaHtml}
      ${textHtml}
      ${mdHtml}
      <div class="m-foot">
        <button class="m-btn" onclick="toggleFav(${JSON.stringify(it.uid)})">${isFav(it.uid)?'♥ 已收藏':'♡ 收藏'}</button>
        <a class="m-btn" href="${esc(orig)}" target="_blank" rel="noopener">查看原作品 ↗</a>
      </div>
      <div class="detail-hint">真实数据抓取自 ${siteLabel(it.site)} · 点击遮罩或按 ESC 关闭</div>
    </div>`;
  const modal=document.getElementById('modal');
  modal.innerHTML=`<div class="modal-card">${inner}</div>`;
  modal.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){const m=document.getElementById('modal');m.classList.remove('show');m.innerHTML='';document.body.style.overflow='';}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('search').addEventListener('input',e=>{searchQ=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{sortDir=e.target.value;render();});
document.getElementById('win').addEventListener('change',e=>{activeWin=e.target.value;render();});

/* ---------- theme ---------- */
function sunIcon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';}
function moonIcon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').innerHTML = t==='dark'?sunIcon():moonIcon();
  try{localStorage.setItem('ds-theme',t);}catch(e){}
}
(function initTheme(){
  let t; try{t=localStorage.getItem('ds-theme');}catch(e){}
  if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  applyTheme(t);
  document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    applyTheme(cur==='dark'?'light':'dark');
  });
})();

renderSiteNav();
renderFavNav();
renderPills();
render();
function toast(msg, ms=3200){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast';
    document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), ms);
}

(function initRefresh(){
  const btn=document.getElementById('refreshBtn');
  const label=document.getElementById('refreshLabel');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    btn.disabled=true; btn.classList.add('spin'); const old=label.textContent; label.textContent='采集中…';
    if(location.protocol==='file:'){
      toast('⚠ 当前是 file:// 协议，无法采集。请通过 http://127.0.0.1:8789 访问');
      btn.disabled=false; btn.classList.remove('spin'); label.textContent=old; return;
    }
    // 云端静态托管（GitHub Pages 等）：无后端，改为提示自动更新机制
    const isLocal = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
    if(!isLocal){
      toast('☁ 云端为静态托管，由 GitHub Actions 每 6 小时 (UTC) 自动刷新；如需立即更新，请到仓库 Actions 页手动 Run workflow');
      btn.disabled=false; btn.classList.remove('spin'); label.textContent=old; return;
    }
    try{
      const resp=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      const data=await resp.json();
      if(!resp.ok || !data.ok) throw new Error(data.error||('HTTP '+resp.status));
      const by=data.bySite||{};
      const parts=Object.keys(by).map(k=>k+': '+by[k]).join(' · ');
      toast(`✓ 已采集 ${data.total} 条（${data.videos} 视频）· 窗口近${data.window}天　正在刷新…`);
      setTimeout(()=>location.reload(), 900);
    }catch(e){
      toast(`采集失败：${e.message||e}　当前 origin: ${location.origin}，请用 http://127.0.0.1:8789 打开`);
      btn.disabled=false; btn.classList.remove('spin'); label.textContent=old;
    }
  });
})();

renderSiteNav();
renderFavNav();
renderPills();
render();
</script>
<div id="toast" class="toast"></div>
</body>
